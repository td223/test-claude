server {
    # 80 is the usual port; 3000 matches Coolify's default "Ports Exposes",
    # so the site works whichever one Coolify is set to.
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health.json {
        add_header Cache-Control "no-store";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
